<!-- Contenedor principal centrado -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white to-yellow-300 px-4">
  <div class="rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md bg-yellow-300/90">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6 animate-slide-down">
      Iniciar Sesión
    </h2>

    <form class="space-y-6">
      <!-- Campo de correo -->
      <div>
        <label for="email" class="block text-gray-700 font-medium mb-2">
          Correo Electrónico
        </label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          placeholder="ejemplo@correo.com"
        />
      </div>

      <!-- Campo de contraseña -->
      <div>
        <label for="password" class="block text-gray-700 font-medium mb-2">
          Contraseña
        </label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          placeholder="••••••••"
        />
      </div>

      <!-- Botón de enviar -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold tracking-wide"
      >
        Iniciar Sesión
      </button>
    </form>

    <!-- Enlace de registro -->
    <p class="text-center text-gray-600 mt-6 animate__animated animate__delay-1s animate__flipInY">
      ¿No tienes cuenta?
      <span
        class="text-blue-500 hover:underline cursor-pointer animate__animated animate__delay-1s animate__flipInY hover:text-blue-400"  
        (click)="irRegister()"
      >
        Regístrate aquí
      </span>
    </p>
  </div>
</div>
