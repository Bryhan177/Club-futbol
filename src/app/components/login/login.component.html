<div class="min-h-screen grid grid-cols-2 bg-gradient-to-br from-white to-yellow-300">
  <!-- Columna de la imagen (izquierda) -->
  <div class="img w-full h-full bg-cover bg-center"></div>

  <!-- Columna del login (derecha) -->
  <div
    class="flex items-center justify-center animate-fade-in"
  >
    <div class="rounded-2xl shadow-2xl p-8 w-full max-w-md">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-6 animate-slide-down">
        Iniciar Sesión
      </h2>
      <form>
        <div class="mb-4">
          <label class="block text-gray-700 font-medium mb-2" for="email">
            Correo Electrónico
          </label>
          <input
            type="email"
            id="email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            placeholder="ejemplo@correo.com"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-700 font-medium mb-2" for="password">
            Contraseña
          </label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 ring-offset-blue-600:ring-purple-500 transition"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold tracking-wide"
        >
          Iniciar Sesión
        </button>
      </form>

      <p class="text-center text-gray-600 mt-6">
        ¿No tienes cuenta?
        <span class="text-blue-500 hover:underline cursor-pointer hover:text-yellow-400">Regístrate aquí</span>
      </p>
    </div>
  </div>
</div>
