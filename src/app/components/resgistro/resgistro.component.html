<div class="flex min-h-screen">
  <!-- Imagen a la izquierda -->
  <div class="w-1/2 hidden md:block img"></div>

  <!-- Formulario a la derecha -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-6 bg-gray-100">
    <form
      [formGroup]="registroForm!"
      (ngSubmit)="onSubmit()"
      class="w-full max-w-md bg-yellow-300 p-8 rounded-2xl shadow-md space-y-6"
    >
      <h2 class="text-2xl font-bold text-center">Registro</h2>

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input
          type="text"
          formControlName="nombre"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="registroForm.get('nombre')?.touched && registroForm.get('nombre')?.invalid" class="text-sm text-red-600 mt-1">
          <small *ngIf="registroForm.get('nombre')?.errors?.['required']">El nombre es obligatorio</small>
          <small *ngIf="registroForm.get('nombre')?.errors?.['minlength']">Mínimo 3 caracteres</small>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="registroForm.get('email')?.touched && registroForm.get('email')?.invalid" class="text-sm text-red-600 mt-1">
          <small *ngIf="registroForm.get('email')?.errors?.['required']">El email es obligatorio</small>
          <small *ngIf="registroForm.get('email')?.errors?.['email']">Formato de email inválido</small>
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="registroForm.get('password')?.touched && registroForm.get('password')?.invalid" class="text-sm text-red-600 mt-1">
          <small *ngIf="registroForm.get('password')?.errors?.['required']">La contraseña es obligatoria</small>
          <small *ngIf="registroForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres</small>
        </div>
      </div>

      <!-- Confirmar Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
        <input
          type="password"
          formControlName="confirmarPassword"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="registroForm.get('confirmarPassword')?.touched && registroForm.get('confirmarPassword')?.invalid" class="text-sm text-red-600 mt-1">
          <small *ngIf="registroForm.get('confirmarPassword')?.errors?.['required']">Campo obligatorio</small>
        </div>
        <div *ngIf="registroForm.errors?.['passwordsMismatch'] && registroForm.get('confirmarPassword')?.touched" class="text-sm text-red-600 mt-1">
          <small>Las contraseñas no coinciden</small>
        </div>
      </div>

      <!-- Botón -->
      <div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition"
        >
          Registrarse
        </button>
      </div>
    </form>
  </div>
</div>
