<div class="container">
  <h1>Equipos de Fútbol</h1>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Ciudad</th>
        <th>Fundación</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let equipo of equipos">
        <td>{{ equipo.nombre }}</td>
        <td>{{ equipo.ciudad }}</td>
        <td>{{ equipo.fundacion }}</td>
      </tr>
    </tbody>
  </table>
